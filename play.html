<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Play AKR2 SWF</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="ruffle" style="width:1200px;height:900px;"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("ruffle").appendChild(player);
      player.style.width = "1200px";
      player.style.height = "900px";
      player.load("data/akoopasrevenge2v2p9p0p4.swf");
    });
  </script>
</body>
</html>
