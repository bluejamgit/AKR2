<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Play AKR2 SWF</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #ruffle {
      width: 1200px;
      height: 900px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="ruffle"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "1200px";
      player.style.height = "900px";
      document.getElementById("ruffle").appendChild(player);
      player.load("data/akoopasrevenge2v2p9p0p4.swf");
    });
  </script>
</body>
</html>
