<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Play SWF Game</title>
  <!-- Ruffle JS, loads from CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="ruffle" style="width:800px;height:600px;"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("ruffle").appendChild(player);
      player.load("game.swf"); // Update path if file is in assets/: "assets/game.swf"
    });
  </script>
</body>
</html>
